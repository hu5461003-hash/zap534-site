<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>聊天记录</title>
    <style>:root {
  color-scheme: light;
  --bg: #f6f7fb;
  --card: #ffffff;
  --text: #1f2a37;
  --muted: #6b7280;
  --accent: #4f46e5;
  --sent: #dbeafe;
  --received: #ffffff;
  --border: #e5e7eb;
  --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  --radius: 16px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.page {
  max-width: 1080px;
  margin: 0 auto;
  padding: 8px 20px;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  background: var(--card);
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
  padding: 12px 20px;
  flex-shrink: 0;
}

.title {
  font-size: 16px;
  font-weight: 600;
  margin: 0;
  display: inline;
}

.meta {
  color: var(--muted);
  font-size: 13px;
  display: inline;
  margin-left: 12px;
}

.meta span {
  margin-right: 10px;
}

.controls {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  flex-wrap: wrap;
}

.controls input,
.controls button {
  border-radius: 8px;
  border: 1px solid var(--border);
  padding: 6px 10px;
  font-size: 13px;
  font-family: inherit;
}

.controls input[type="search"] {
  width: 200px;
}

.controls input[type="datetime-local"] {
  width: 200px;
}

.controls button {
  background: var(--accent);
  color: #fff;
  border: none;
  cursor: pointer;
  padding: 6px 14px;
}

.controls button:active {
  transform: scale(0.98);
}

.stats {
  font-size: 13px;
  color: var(--muted);
  margin-left: auto;
}

.message-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 4px 0;
}

.message {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.message.hidden {
  display: none;
}

.message-time {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}

.message-row {
  display: flex;
  gap: 12px;
  align-items: flex-end;
}

.message.sent .message-row {
  flex-direction: row-reverse;
}

.avatar {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: #eef2ff;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
  color: #475569;
  font-weight: 600;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.bubble {
  max-width: min(70%, 720px);
  background: var(--received);
  border-radius: 18px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
}

.message.sent .bubble {
  background: var(--sent);
  border-color: transparent;
}

.sender-name {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}

.message-content {
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 14px;
  line-height: 1.6;
}

.message-text {
  word-break: break-word;
}

.quoted-message {
  border-left: 3px solid rgba(79, 70, 229, 0.35);
  background: rgba(79, 70, 229, 0.06);
  border-radius: 12px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.message.sent .quoted-message {
  background: rgba(37, 99, 235, 0.08);
  border-left-color: rgba(37, 99, 235, 0.35);
}

.quoted-sender {
  font-size: 12px;
  color: #374151;
  font-weight: 600;
}

.quoted-text {
  font-size: 13px;
  color: #4b5563;
  word-break: break-word;
}

.message-link-card {
  color: #2563eb;
  text-decoration: underline;
  text-underline-offset: 2px;
  word-break: break-all;
}

.message-link-card:hover {
  color: #1d4ed8;
}

.inline-emoji {
  width: 22px;
  height: 22px;
  vertical-align: text-bottom;
  margin: 0 2px;
}

.message-media {
  border-radius: 14px;
  max-width: 100%;
}

.previewable {
  cursor: zoom-in;
}

.message-media.image,
.message-media.emoji {
  max-height: 260px;
  object-fit: contain;
  background: #f1f5f9;
  padding: 6px;
}

.message-media.emoji {
  max-height: 160px;
  width: auto;
}

.message-media.video {
  max-height: 360px;
  background: #111827;
}

.message-media.audio {
  width: 260px;
}

.message-media.file {
  display: inline-flex;
  align-items: center;
  color: #2563eb;
  text-decoration: underline;
  text-underline-offset: 2px;
  word-break: break-all;
}

.message-media.file:hover {
  color: #1d4ed8;
}

.image-preview {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  z-index: 999;
}

.image-preview.active {
  opacity: 1;
  pointer-events: auto;
}

.image-preview img {
  max-width: min(90vw, 1200px);
  max-height: 90vh;
  border-radius: 18px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
  background: #0f172a;
  transition: transform 0.1s ease;
  cursor: zoom-out;
}

.highlight {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
  border-radius: 18px;
  transition: outline-color 0.3s;
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 40px;
}

/* Scroll Container */
.scroll-container {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  margin-top: 8px;
  margin-bottom: 8px;
  padding: 12px;
  -webkit-overflow-scrolling: touch;
}

.scroll-container::-webkit-scrollbar {
  width: 6px;
}

.scroll-container::-webkit-scrollbar-thumb {
  background: #c1c1c1;
  border-radius: 3px;
}

.load-sentinel {
  height: 1px;
}
</style>
  </head>
  <body>
    <div class="page">
      <div class="header">
        <h1 class="title">皮希平</h1>
        <div class="meta">
          <span>185339 条消息</span>
          <span>私聊</span>
          <span>2026-09-09 03:31:54</span>
        </div>
        <div class="controls">
          <input id="searchInput" type="search" placeholder="搜索消息..." />
          <input id="timeInput" type="datetime-local" />
          <button id="jumpBtn" type="button">跳转</button>
          <div class="stats">
            <span id="resultCount">共 185339 条</span>
          </div>
        </div>
      </div>
      
      <div id="scrollContainer" class="scroll-container"></div>
      
    </div>
    
    <div class="image-preview" id="imagePreview">
      <img id="imagePreviewTarget" alt="预览" />
    </div>

        <!-- Password Gate v2 -->
    <style>
      #zapGate{position:fixed;inset:0;background:#f6f7fb;display:flex;align-items:center;justify-content:center;z-index:2147483647;font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif}
      #zapGate .box{background:#fff;border-radius:16px;box-shadow:0 12px 30px rgba(15,23,42,.08);padding:32px 36px;width:min(320px,86vw);text-align:center}
      #zapGate h2{font-size:16px;color:#1f2a37;margin:0 0 18px;font-weight:600}
      #zapGate input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px;font-size:15px;outline:none;text-align:center;letter-spacing:2px;background:#fff;color:#1f2a37}
      #zapGate input:focus{border-color:#4f46e5}
      #zapGate button{width:100%;margin-top:14px;padding:10px 0;border:0;border-radius:10px;background:#4f46e5;color:#fff;font-size:15px;cursor:pointer}
      #zapGate button:hover{background:#4338ca}
      #zapGate .err{color:#ef4444;font-size:12px;min-height:16px;margin:10px 0 0}
      #zapGate .spin{width:28px;height:28px;margin:0 auto 14px;border:3px solid #e5e7eb;border-top-color:#4f46e5;border-radius:50%;animation:zapSpin .8s linear infinite}
      @keyframes zapSpin{to{transform:rotate(360deg)}}
      #zapGate .sub{color:#6b7280;font-size:12px;margin:6px 0 0}
      #zapPill{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(17,24,39,.85);color:#fff;font-size:12px;line-height:1;padding:9px 16px;border-radius:999px;z-index:2147483646;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;transition:opacity .6s;pointer-events:none;white-space:nowrap}
      #zapPill.zap-err{background:#dc2626;pointer-events:auto;cursor:pointer}
    </style>
    <div id="zapGate">
      <div class="box" id="zapLoginBox">
        <h2>此内容已加密保护</h2>
        <input id="zapPw" type="password" placeholder="请输入访问密码" autocomplete="off">
        <button id="zapGo" type="button">进入</button>
        <div class="err" id="zapErr"></div>
      </div>
      <div class="box" id="zapLoadBox" style="display:none">
        <div class="spin"></div>
        <p style="margin:0;font-size:14px;color:#1f2a37">正在加载首屏…</p>
        <p class="sub">仅首次访问需等待，之后本机缓存秒开</p>
      </div>
    </div>
    <div id="zapPill" class="zap-pill" style="display:none"></div>
    <script>
      (function () {
  var TOTAL = 185339;
  var PREFIX = ['emoji-v2.js', 'd1-v2.js', 'app-v2.js'];
  var REST = ["d2-v2.js","d3-v2.js","d4-v2.js","d5-v2.js","d6-v2.js","d7-v2.js"];
  var KEY = atob('MTUzNA==');
  var gate = document.getElementById('zapGate');
  var loginBox = document.getElementById('zapLoginBox');
  var loadBox = document.getElementById('zapLoadBox');
  var pw = document.getElementById('zapPw');
  var err = document.getElementById('zapErr');
  var pill = document.getElementById('zapPill');
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function addScript(src, onload, onerr) {
    var s = document.createElement('script');
    s.src = src; s.async = false; s.onload = onload; s.onerror = onerr;
    document.head.appendChild(s);
  }
  function fail(f) {
    pill.style.display = 'block';
    pill.className = 'zap-pill zap-err';
    pill.textContent = '网络中断（' + f + '），点击重试';
    pill.onclick = function () { location.reload(); };
  }
  function afterChunk() {
    try {
      var items = window.Z_CHUNK || [];
      allData = window.WEFLOW_DATA;
      var q = '';
      try { q = (searchInput.value || '').trim(); } catch (e) {}
      if (!q) { currentList = allData; renderer.appendData(items); }
      updateCount();
    } catch (e) {}
    pill.textContent = '后台同步中 · ' + fmt(window.WEFLOW_DATA.length) + ' / ' + fmt(TOTAL) + ' 条';
  }
  function startLoading() {
    loginBox.style.display = 'none';
    loadBox.style.display = 'block';
    if ('serviceWorker' in navigator) {
      try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
    }
    var i = 0;
    (function next() {
      if (i >= PREFIX.length) {
        loadBox.style.display = 'none';
        gate.style.display = 'none';
        pill.style.display = 'block';
        pill.textContent = '后台同步中 · ' + fmt(window.WEFLOW_DATA.length) + ' / ' + fmt(TOTAL) + ' 条';
        REST.forEach(function (f) {
          addScript(f, function () {
            afterChunk();
            if (window.WEFLOW_DATA.length >= TOTAL) {
              pill.textContent = '已全部加载 · ' + fmt(TOTAL) + ' 条';
              setTimeout(function () { pill.style.opacity = '0'; }, 2000);
            }
          }, function () { fail(f); });
        });
        return;
      }
      var f = PREFIX[i++];
      addScript(f, next, function () { fail(f); });
    })();
  }
  function unlock() {
    if (pw.value === KEY) {
      try { sessionStorage.setItem('zap_ok', '1'); } catch (e) {}
      startLoading();
    } else {
      err.textContent = '密码错误，请重试';
      pw.value = '';
      pw.focus();
    }
  }
  document.getElementById('zapGo').addEventListener('click', unlock);
  pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') unlock(); });
  try { if (sessionStorage.getItem('zap_ok') === '1') startLoading(); } catch (e) {}
})();
    </script>
  </body>
</html>
